[package]
name = "osu-storyboard-render"
version = "0.1.0"
edition = "2021"
description = "Render osu! storyboards (.osb / .osu Events) from source with wgpu"
license = "MIT"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp"] }
log = "0.4"
pollster = "0.4"
wgpu = "24"
winit = "0.30"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1
